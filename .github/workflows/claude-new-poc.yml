name: Create PoC Repository
on:
  issues:
    types: [labeled]

jobs:
  create-poc-repo:
    if: github.event.label.name == 'new-poc'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.POC_REPO_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_URL: ${{ github.event.issue.html_url }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate repo name
        id: repo
        run: |
          SLUG_RAW=$(claude -p "次のIssueタイトルをURLセーフなスラッグに変換してください。日本語はローマ字（ヘボン式）に変換すること。出力はスラッグ文字列のみ（説明・引用符・改行は不要）。小文字の英数字とハイフンのみ、40文字以内。

          タイトル: ${ISSUE_TITLE}" --output-format text)
          SLUG=$(echo "$SLUG_RAW" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-40)
          if [ -z "$SLUG" ]; then
            SLUG="poc"
          fi
          NAME="claude-poc__${ISSUE_NUMBER}-${SLUG}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Configure git authentication
        run: gh auth setup-git

      - name: Create private repository from boilerplate template
        run: |
          gh repo create "$OWNER/${{ steps.repo.outputs.name }}" \
            --template "daimaru-shinoda/claude-template" \
            --private \
            --description "PoC for ${{ github.repository }}#${ISSUE_NUMBER}"

      - name: Clone new repository (wait for template generation)
        run: |
          for i in $(seq 1 10); do
            rm -rf poc-repo
            gh repo clone "$OWNER/${{ steps.repo.outputs.name }}" poc-repo
            if [ -f poc-repo/README.md ]; then
              break
            fi
            echo "Template generation not ready yet, retrying..."
            sleep 3
          done

      - name: Link source issue in README and push
        working-directory: poc-repo
        run: |
          {
            echo "> PoC generated from issue: ${ISSUE_URL}"
            echo ">"
            echo "> ${ISSUE_TITLE}"
            echo
            cat README.md 2>/dev/null || true
          } > README.md.new
          mv README.md.new README.md
          git config user.name "claude-poc-bot"
          git config user.email "noreply@anthropic.com"
          git add README.md
          git commit -m "Link source issue in README"
          git push

      - name: Generate design doc
        working-directory: poc-repo
        run: |
          mkdir -p docs
          claude -p "以下のIssueの内容を読み、PoCの実装方針を docs/plan.md に書いてください。方針だけでなく判断理由（Why）も記載してください。コード自体はまだ書かないでください。

          # Issue: ${ISSUE_TITLE}

          ${ISSUE_BODY}" \
            --allowedTools "Write" \
            --output-format text

      - name: Commit and push design doc
        working-directory: poc-repo
        run: |
          git add docs/plan.md
          git commit -m "Add initial design doc"
          git push

      - name: Comment back on issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" \
            --body "PoCリポジトリを作成しました: https://github.com/${OWNER}/${{ steps.repo.outputs.name }}"
